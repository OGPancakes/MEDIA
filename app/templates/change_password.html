{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
    <div class="auth-copy-block">
        <span class="eyebrow">Account security</span>
        <h1>Change your password</h1>
        <p class="muted">{% if force %}Your account is using the temporary password. Choose a new password before continuing.{% else %}Update your password below.{% endif %}</p>
    </div>
    <form class="card auth-login-block" method="post" action="{{ url_for('change_password') }}">
        <label>Current password
            <input type="password" name="current_password" required autocomplete="current-password">
        </label>
        <label>New password
            <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
        </label>
        <label>Confirm new password
            <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
        </label>
        <button class="button primary" type="submit">Save password</button>
    </form>
</section>
{% endblock %}
